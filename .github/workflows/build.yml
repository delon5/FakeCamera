name: Build

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build fakecamera.suprx
        run: |
          cmake -S . -B build
          cmake --build build
          sha256sum build/fakecamera.suprx

      - uses: actions/upload-artifact@v4
        with:
          name: fakecamera
          path: build/fakecamera.suprx

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/fakecamera.suprx
